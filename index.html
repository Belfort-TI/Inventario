<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventário de TI - Belfort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4F7;--panel:#fff;--ink:#14202E;--mute:#5B6B7B;--line:#E0E5EB;--nb:#0B7A75;--dk:#1F3A5F;--mn:#D08A1F;--warn:#B45309;--hl:#E8F4F3;--r:12px;--sh:0 1px 2px rgba(20,32,46,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D141C;--panel:#16202B;--ink:#E6EBF0;--mute:#93A3B3;--line:#243240;--nb:#35B8B0;--dk:#7FA6DB;--mn:#E8A83E;--warn:#F0A04B;--hl:#16302F;--sh:none}}
:root[data-theme="dark"]{--bg:#0D141C;--panel:#16202B;--ink:#E6EBF0;--mute:#93A3B3;--line:#243240;--nb:#35B8B0;--dk:#7FA6DB;--mn:#E8A83E;--warn:#F0A04B;--hl:#16302F;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Source Sans 3",system-ui,sans-serif}
h1,h2,.big,b{font-family:Archivo,system-ui,sans-serif}
h1,h2,.big{letter-spacing:-.02em;margin:0}
main{max-width:1120px;margin:0 auto;padding:40px 20px 72px}
header{display:flex;align-items:center;gap:16px;margin-bottom:32px}.logo{width:64px;height:64px;border-radius:14px;flex:none;display:block}
h1{font-size:clamp(30px,5vw,42px);font-weight:800;line-height:1.1}
.sub{color:var(--mute);margin:10px 0 0;max-width:60ch}
section{margin-top:48px}
section:first-of-type{margin-top:0}
h2{font-size:22px;font-weight:700;line-height:1.2}
.hint{color:var(--mute);font-size:15px;margin:4px 0 16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--sh)}
.hero{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.big{font-size:clamp(72px,12vw,112px);font-weight:800;line-height:.9;color:var(--ink)}
.cap{color:var(--mute);margin-top:8px}
.bar{display:flex;height:16px;border-radius:99px;overflow:hidden;margin:24px 0 14px;gap:3px}
.bar i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:15px}
.leg b{font-weight:700}.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.net{display:flex;flex-direction:column;justify-content:center;gap:0;padding:8px 24px}
.net div{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);font-size:16px}
.net div:last-child{border:0}.net b{font-size:26px;font-weight:700}
.charts{display:grid;grid-template-columns:1fr;gap:16px}
.charts .box{padding:20px}.charts .box>b{font-size:16px;font-weight:700}
.row{all:unset;cursor:pointer;display:grid;grid-template-columns:116px 1fr 32px;gap:10px;align-items:center;width:100%;padding:5px 6px;margin:0 -6px;border-radius:8px;font-size:15px;box-sizing:content-box}
.row:hover,.row:focus-visible{background:var(--hl)}.row[aria-pressed=true]{background:var(--hl);font-weight:600}
.row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row em{font-style:normal;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.track{background:var(--bg);border-radius:99px;height:8px;overflow:hidden}.fill{height:100%;border-radius:99px;background:var(--nb)}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 12px}
input,select,button.ghost{font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;height:44px}
input{flex:1 1 260px}
select{flex:0 1 200px}
button.ghost{cursor:pointer;font-weight:600}button.ghost:hover{background:var(--hl);border-color:var(--nb)}
.more{display:flex;justify-content:center;margin:16px 0 0}
:focus-visible{outline:2px solid var(--nb);outline-offset:2px}
.wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:15px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
th{cursor:pointer;font-weight:600;font-size:14px;color:var(--mute);background:var(--bg)}
tbody tr:last-child td{border-bottom:0}
tr.d{cursor:pointer}tr.d:hover{background:var(--hl)}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.tag i{width:8px;height:8px;border-radius:50%}
tr.x td{white-space:normal;background:var(--bg);color:var(--mute);line-height:1.9}tr.x b{color:var(--ink);font-weight:600;margin-left:12px}tr.x b:first-child{margin-left:0}
.cnt{color:var(--mute);font-size:15px;margin:0 2px 10px}
@media(max-width:860px){.hero,.charts{grid-template-columns:1fr}main{padding:28px 16px 56px}section{margin-top:40px}}
.rw-only{display:none}body.rw .rw-only{display:revert}
button.pri{background:var(--nb);border-color:var(--nb);color:#fff}button.pri:hover{background:var(--nb);opacity:.88}
:root[data-theme="dark"] button.pri,:root:not([data-theme="light"]) button.pri{color:#0D141C}
.del{margin-top:8px;color:var(--warn)!important;border-color:var(--warn)!important}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);padding:24px;width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,18,26,.55)}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.fm label{display:grid;gap:4px;font-size:14px;color:var(--mute)}.fm input,.fm select{width:100%;flex:none}
.err{color:var(--warn);min-height:1.5em;margin:0 0 8px;font-size:15px}.act{display:flex;justify-content:flex-end;gap:10px}
@media(max-width:560px){.fm{grid-template-columns:1fr}}
.addrow{margin-bottom:12px}
header{margin-bottom:12px}section h2{margin-bottom:20px}
.ed{height:34px;padding:4px 14px}
body.rw .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.acts .del{margin-top:0}.acts .ed{height:44px}
</style>
</head>

const COMP=['Notebook','Desktop','Mini PC'],COL={Notebook:'var(--nb)',Desktop:'var(--dk)','Mini PC':'var(--mn)'};

const dt=s=>s?s.split('-').reverse().join('/'):'';
function fill(){
  const ts=['',...new Set(D.map(r=>r.t))],ds=['',...[...new Set(D.map(r=>r.dep))].sort()];
  $('ft').innerHTML=ts.map(v=>`<option value="${E(v)}">${v||'Todos os tipos'}</option>`).join('');
  {const cur=$('a_dep').value;$('a_dep').innerHTML='<option value="">Selecione</option>'+ds.slice(1).map(v=>`<option value="${E(v)}">${E(v)}</option>`).join('')+'<option value="__novo">Outro (digitar novo)</option>';$('a_dep').value=cur}
  $('fd').innerHTML=ds.map(v=>`<option value="${E(v)}">${v||'Todos os departamentos'}</option>`).join('');
  const cols=[['host','Hostname'],['col','Pessoa ou local'],['dep','Departamento'],['t','Tipo'],['mod','Modelo'],['ram','RAM'],['disk','Disco'],['pat','Patrimônio'],['av','Antivírus']];
  $('th').innerHTML=cols.map(([k,l])=>`<th data-s="${k}" tabindex="0">${l}${S.sort===k?(S.asc?' ▲':' ▼'):''}</th>`).join('');
}
function rows(){
  let a=D.filter(r=>(!S.t||r.t===S.t)&&(!S.d||r.dep===S.d)&&(!S.fab||r.fab===S.fab)&&(!S.ram||(r.ram?(r.ram>=32?'32+ GB':r.ram+' GB'):'')===S.ram)&&(!S.q||[r.host,r.col,r.pat,r.mod,r.dep,r.ser].join(' ').toLowerCase().includes(S.q)));
  const k=S.sort;a.sort((x,y)=>{const u=x[k]??'',v=y[k]??'';return (typeof u==='number'||typeof v==='number'?(u||0)-(v||0):String(u).localeCompare(String(v),'pt-BR',{numeric:true}))*(S.asc?1:-1)});
  $('cnt').textContent=`${a.length} de ${D.length} registros`;
  $('tb').innerHTML=a.slice(0,S.n).map((r,i)=>`<tr class="d" data-i="${i}"><td>${E(r.host)||'—'}</td><td>${E(r.col)||'—'}</td><td>${E(r.dep)}</td><td><span class="tag"><i style="background:${COL[r.t]||'var(--mute)'}"></i>${r.t}</span></td><td>${E(r.mod)||'—'}</td><td>${r.ram?r.ram+' GB':'—'}</td><td>${E(r.disk)||'—'}</td><td>${E(r.pat)||'—'}</td><td><span class="tag"><i style="background:var(${r.av?'--nb':'--warn'})"></i>${r.av?'OK':'Pendente'}</span></td></tr>

document.addEventListener('click',e=>{
  const x=e.target.closest('.del');
  if(x){if(!x.dataset.c){x.dataset.c=1;x.textContent='Confirmar exclusão';return}
    const id=x.dataset.id;x.disabled=true;
    (/^b\d+$/.test(id)?DB.collection('removed').doc(id).set({at:Date.now()}):DB.collection('extras').doc(id).delete()).catch(()=>{x.disabled=false;x.textContent='Não foi possível excluir'});return}

  if(ed){openDlg(ed.dataset.id);return}
  const c=e.target.closest('.row'),h=e.target.closest('th'),r=e.target.closest('tr.d');

});

function localDB(){
 const subs={extras:[],edits:[],removed:[]};let st={extras:{},edits:{},removed:{}},last='';
 const snap=c=>({docs:Object.entries(st[c]||{}).map(([id,d])=>({id,data:()=>d}))});
 const push=()=>Object.keys(subs).forEach(c=>subs[c].forEach(f=>f(snap(c))));
 const load=async()=>{try{const r=await fetch('/api/state',{cache:'no-store'});const j=await r.text();if(j!==last){last=j;st=JSON.parse(j);push()}}catch(e){}};

 setInterval(load,5000);
 return{collection:c=>({onSnapshot:f=>{subs[c].push(f);load();return()=>{}},doc:id=>({set:d=>w('set',c,id,d),delete:()=>w('delete',c,id)})})}}
const IDS=['t','host','col','dep','mod','ram','disk','pat','ser'];
function openDlg(id){EID=id||null;const o=id?D.find(r=>r.id===id):null;

 const old=EID?D.find(r=>r.id===EID):null,disk=v('disk'),mod=v('mod'),dd=disk.toUpperCase(),m=(mod+' '+v('host')).toUpperCase();
 const fb=[['DELL','Dell'],['LATITUDE','Dell'],['INSPIRON','Dell'],['LENOVO','Lenovo'],['VAIO','Positivo (Vaio)'],['POSITIVO','Positivo (Vaio)'],['HP ','HP']].find(([k])=>m.includes(k));
 const f={t:v('t'),host:v('host'),col:v('col'),dep:(v('dep')==='__novo'?v('depn'):v('dep'))||'Sem departamento',pat:v('pat'),ser:v('ser'),mod,ram:parseInt(v('ram'))||null,disk,dt:dd.startsWith('HD')?'HD':dd.includes('NVME')?'NVMe':dd.includes('SSD')?'SSD':'',fab:fb?fb[1]:(old?old.fab:'')};
 try{
  if(!old){const id='n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
   await DB.collection('extras').doc(id).set({...f,cpu:'',pp:'',sw:'',av:false,chk:false,dup:false,dat:new Date().toISOString().slice(0,10)})}
  else if(/^b\d+$/.test(EID))await DB.collection('edits').doc(EID).set(f);
  else{const {id,...rest}=old;await DB.collection('extras').doc(EID).set({...rest,...f})}
  $('dlg').close()}
 catch(e){$('a_err').textContent='Não foi possível salvar. Confira se o servidor está ligado e tente de novo.'}};
(async()=>{try{DB=localDB();
 document.body.classList.add('rw');
 DB.collection('extras').onSnapshot(s=>{EX={};s.docs.forEach(d=>{EX[d.id]={...d.data(),id:d.id}});sync()},()=>{});
 DB.collection('edits').onSnapshot(s=>{ED={};s.docs.forEach(d=>{ED[d.id]=d.data()});sync()},()=>{});
 DB.collection('removed').onSnapshot(s=>{RM=new Set(s.docs.map(d=>d.id));sync()},()=>{});
}catch(e){}})();
</script>
